name: Android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs, not tags - a moved tag is a supply-
      # chain attack in waiting. Verified against the repos on 2026-08-01.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint (Play Store gate)
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synaxis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Actions pinned to commit SHAs, not tags - a moved tag is a supply-
      # chain attack in waiting. Verified against the repos on 2026-08-01.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > synaxis-release.jks
          ls -l synaxis-release.jks

      - name: Version from the tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Assemble signed release (APK + AAB)
        env:
          SYNAXIS_STORE_FILE: synaxis-release.jks
          SYNAXIS_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SYNAXIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SYNAXIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Name it after the tag
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Synaxis-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/*.aab "out/Synaxis-${GITHUB_REF_NAME}.aab"
          ls -l out

      - name: Shred the key
        if: always()
        run: |
          shred -u synaxis-release.jks 2>/dev/null || rm -f synaxis-release.jks

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synaxis-release-apk
          path: out/*.apk
          retention-days: 90

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            out/*.apk
            out/*.aab
          generate_release_notes: true