name: Android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: synaxis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > synaxis-release.jks
          ls -l synaxis-release.jks

      - name: Version from the tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Assemble signed release
        env:
          SYNAXIS_STORE_FILE: synaxis-release.jks
          SYNAXIS_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SYNAXIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SYNAXIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name it after the tag
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Synaxis-${GITHUB_REF_NAME}.apk"
          ls -l out

      - name: Shred the key
        if: always()
        run: rm -f synaxis-release.jks

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: synaxis-release-apk
          path: out/*.apk
          retention-days: 90

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true