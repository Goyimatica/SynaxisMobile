name: Data tools

on:
  # Temporary pipeline workflow - run it by hand (gh workflow run), pull the
  # artifacts, then commit the harvested index.  Not tied to push so it can
  # never race the Android build.
  workflow_dispatch:

jobs:
  pipeline:
    name: Harvest + verify x2 + audit + schism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node 20
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check tools/audit.js
          node --check tools/harvest.js
          node --check tools/fill-gaps.js
          node --check tools/fix-calendar.js
          node --check tools/verify.js
          node --check tools/check-schism.js
          node --check tools/check-quotes.js
          node --check tools/check-pages.js

      - name: Make the report dir
        run: mkdir -p reports

      - name: Apply calendar corrections
        run: node tools/fix-calendar.js | tee reports/fix.txt

      - name: Harvest day templates
        run: node tools/harvest.js | tee reports/harvest.txt

      - name: Fill gaps from the V8 backlog
        run: node tools/fill-gaps.js | tee reports/fill.txt

      - name: Verify (first run)
        run: node tools/verify.js | tee reports/verify1.txt
        continue-on-error: true

      - name: Verify (second run)
        run: node tools/verify.js | tee reports/verify2.txt
        continue-on-error: true

      - name: Audit against the calendars
        run: node tools/audit.js | tee reports/audit.txt
        continue-on-error: true

      - name: Scan for schismatics
        run: node tools/check-schism.js | tee reports/schism.txt
        continue-on-error: true

      - name: Check the daily quotes
        run: node tools/check-quotes.js | tee reports/quotes.txt
        continue-on-error: true

      - name: Check every page resolves
        run: node tools/check-pages.js | tee reports/pages.txt
        continue-on-error: true

      - name: Upload the report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pipeline-report
          path: reports/*.txt
          retention-days: 14

      - name: Upload the harvested index
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: saints-json
          path: app/src/main/assets/saints.json
          retention-days: 14
