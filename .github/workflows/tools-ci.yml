name: Data tools

on:
  # Data pipeline - run it by hand (gh workflow run), it re-harvests the
  # calendar, re-runs every check, and commits the verified saints.json
  # straight to the repo when every gate passes.  No Actions artifacts:
  # the storage quota kept eating the uploads, and the commit is the
  # artifact.  The push to main then triggers the Android build.
  workflow_dispatch:

jobs:
  pipeline:
    name: Harvest + verify x2 + audit + schism
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node 20
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check tools/audit.js
          node --check tools/harvest.js
          node --check tools/fill-gaps.js
          node --check tools/fix-calendar.js
          node --check tools/verify.js
          node --check tools/check-schism.js
          node --check tools/check-quotes.js
          node --check tools/check-pages.js

      - name: Make the report dir
        run: mkdir -p reports

      - name: Apply calendar corrections
        run: node tools/fix-calendar.js | tee reports/fix.txt

      - name: Harvest day templates
        run: node tools/harvest.js | tee reports/harvest.txt

      - name: Fill gaps from the V8 backlog
        run: node tools/fill-gaps.js | tee reports/fill.txt

      - name: Verify (first run)
        continue-on-error: true
        run: |
          node tools/verify.js | tee reports/verify1.txt
          echo ${PIPESTATUS[0]} > reports/verify1.code

      - name: Verify (second run)
        continue-on-error: true
        run: |
          node tools/verify.js | tee reports/verify2.txt
          echo ${PIPESTATUS[0]} > reports/verify2.code

      - name: Audit against the calendars
        continue-on-error: true
        run: |
          node tools/audit.js | tee reports/audit.txt
          echo ${PIPESTATUS[0]} > reports/audit.code

      - name: Scan for schismatics
        continue-on-error: true
        run: |
          node tools/check-schism.js | tee reports/schism.txt
          echo ${PIPESTATUS[0]} > reports/schism.code

      - name: Check the daily quotes
        continue-on-error: true
        run: |
          node tools/check-quotes.js | tee reports/quotes.txt
          echo ${PIPESTATUS[0]} > reports/quotes.code

      - name: Check every page resolves
        continue-on-error: true
        run: |
          node tools/check-pages.js | tee reports/pages.txt
          echo ${PIPESTATUS[0]} > reports/pages.code

      - name: Show the reports
        if: always()
        run: |
          for f in reports/*.txt; do
            echo "===== $(basename "$f") ====="
            tail -12 "$f"
            echo ""
          done

      - name: Commit the verified index
        run: |
          set -e
          for f in verify1 verify2 audit schism quotes pages; do
            code=$(cat "reports/$f.code")
            echo "gate $f: exit $code"
            [ "$code" = "0" ] || { echo "!! $f failed - refusing to commit"; exit 1; }
          done
          git config user.name "synaxis-ci"
          git config user.email "actions@github.com"
          git add app/src/main/assets/saints.json
          if git diff --cached --quiet; then
            echo "saints.json unchanged - nothing to commit"
          else
            git commit -m "data: refresh the verified calendar index (pipeline)"
            git push origin main
          fi
